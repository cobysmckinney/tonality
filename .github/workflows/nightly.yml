# Nightly builds: every night that main has changed, build it and replace the rolling `nightly`
# prerelease. Apps on the nightly channel update from its latest.json.
#
# The version is the next patch after the current stable, as a prerelease
# (0.1.0 → 0.1.1-nightly.20261121.42), so it sorts above the release it follows and below the
# next one. Run it by hand (Actions → Nightly → Run workflow) to build now, changed or not.
#
# As in release.yml, only the publish job gets a write token, and it runs only gh and jq.
name: Nightly

on:
  schedule:
    # 07:00 UTC: overnight in the Americas, morning in Europe.
    - cron: "0 7 * * *"
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

permissions: {}

env:
  TAG: nightly

jobs:
  prepare:
    name: Anything new?
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      build: ${{ steps.check.outputs.build }}
      sha: ${{ steps.check.outputs.sha }}
      version: ${{ steps.check.outputs.version }}
      notes: ${{ steps.check.outputs.notes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY_BUILD: ${{ github.run_number }}
        run: |
          sha=$(git rev-parse HEAD)
          last=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.sha 2>/dev/null || true)
          if [ "$sha" = "$last" ] && [ "$GITHUB_EVENT_NAME" = schedule ]; then
            echo "main is still at $sha, the last nightly; nothing to build."
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version=$(node scripts/version.mjs --nightly)
          stable=$(node scripts/version.mjs)
          {
            echo "build=true"
            echo "sha=$sha"
            echo "version=$version"
            echo "notes<<TONALITY_NOTES_EOF"
            echo "Nightly build of main at ${sha:0:7}, $(date -u +'%Y-%m-%d')."
            echo
            echo "Changes since v$stable: https://github.com/$GITHUB_REPOSITORY/compare/v$stable...$sha"
            echo "TONALITY_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Building $version from $sha"

  build:
    name: Build
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
      version: ${{ needs.prepare.outputs.version }}
      download_url: https://github.com/${{ github.repository }}/releases/download/nightly
      notes: ${{ needs.prepare.outputs.notes }}
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

  publish:
    name: Publish nightly
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release

      - name: Replace the nightly release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.prepare.outputs.sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
          NOTES: ${{ needs.prepare.outputs.notes }}
        run: |
          ls -l release
          repo=(--repo "$GITHUB_REPOSITORY")
          title="tonality nightly ($VERSION)"
          # Only the very first nightly has no release to upload into. Creating it puts the tag
          # on this commit at once; every later run moves the tag last (below).
          existed=true
          if ! gh release view "$TAG" "${repo[@]}" >/dev/null 2>&1; then
            existed=false
            gh release create "$TAG" "${repo[@]}" --target "$SHA" --title "$title" --notes "$NOTES" \
              --prerelease --latest=false
          fi

          # The installers first, then the manifest that points at them, so an app checking
          # in between never finds a latest.json naming files that aren't there yet.
          find release -type f ! -name latest.json -print0 |
            xargs -0 gh release upload "$TAG" "${repo[@]}" --clobber
          gh release upload "$TAG" release/latest.json "${repo[@]}" --clobber

          # Only now does the tag move. "Anything new?" compares main with it, so moving it
          # before the uploads would make a night whose upload failed look finished, and it
          # would never be built again.
          if [ "$existed" = true ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" -f sha="$SHA" -F force=true >/dev/null
            gh release edit "$TAG" "${repo[@]}" --title "$title" --notes "$NOTES" \
              --prerelease --latest=false
          fi

          # Last night's installers (their names carry the version) go.
          gh release view "$TAG" "${repo[@]}" --json assets --jq '.assets[].name' |
            while read -r name; do
              [ -e "release/$name" ] || gh release delete-asset "$TAG" "$name" "${repo[@]}" --yes
            done
