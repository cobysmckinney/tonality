# Stable releases. Two ways to start one:
#
#   - Actions → Release → Run workflow (or `npm run release -- minor`): bumps the version on
#     main (patch, minor, major, or an exact X.Y.Z), commits "Release vX.Y.Z" and tags it.
#     That run ends there; the tag push starts a second run that builds and publishes.
#     Nothing to do locally.
#   - Push a tag like `v0.2.0` yourself; it has to match the version in tauri.conf.json.
#
# main and v* tags are protected by repository rulesets, so the bump is pushed with the
# RELEASE_DEPLOY_KEY secret: a deploy key with write access that the rulesets let through.
# (Pushes made with the workflow's own token neither get past the rules nor start workflows.)
#
# The release stays a draft until every build has uploaded, so a half-built release is never
# public, and the in-app updater (which reads the latest release's latest.json) never sees one.
#
# Only the small jobs that touch the repo or the release get write access, and they run no
# dependencies: just git, gh, jq and scripts/version.mjs. The builds (build.yml) run `npm ci`,
# every crate's build script and third-party actions, so they get a read-only token.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version: patch, minor, major, or an exact X.Y.Z"
        type: string
        default: patch
        required: true

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  bump:
    name: Bump and tag
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Releases are cut from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Releases are cut from main (this run is on $GITHUB_REF)"
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - name: Bump the version, commit and tag
        env:
          BUMP: ${{ inputs.version }}
        run: |
          version=$(node scripts/version.mjs "$BUMP")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release v$version"
          git tag "v$version"
          git push --atomic origin HEAD:refs/heads/main "refs/tags/v$version"
          echo "Tagged v$version at $(git rev-parse HEAD); the tag's own run builds and publishes it."

  prepare:
    name: Draft the release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      notes: ${{ steps.draft.outputs.notes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Version
        id: version
        run: |
          version=$(node scripts/version.mjs)
          tag="v$version"
          if [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match tauri.conf.json version $version (expected $tag)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create the draft (or reuse it on a re-run)
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
              --title "tonality $TAG" --generate-notes
          # What the in-app updater shows about this release.
          {
            echo "notes<<TONALITY_NOTES_EOF"
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body
            echo "TONALITY_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: prepare
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.prepare.outputs.tag }}
      version: ${{ needs.prepare.outputs.version }}
      download_url: https://github.com/${{ github.repository }}/releases/download/${{ needs.prepare.outputs.tag }}
      notes: ${{ needs.prepare.outputs.notes }}
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

  publish:
    name: Publish release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release

      - name: Attach the files and publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          ls -l release
          gh release upload "$TAG" release/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
