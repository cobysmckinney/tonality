# Push a tag like `v0.1.0` to build installers and publish them as a GitHub release.
#
# The tag has to match the version in src-tauri/tauri.conf.json. The release stays a draft
# until all three builds have uploaded, so a half-built release is never public.
#
# Only the two small jobs that touch the release get a write token, and neither runs project
# code. The builds run `npm ci`, every crate's build script and third-party actions, so they
# get a read-only token and hand their installers on as workflow artifacts.
name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions: {}

env:
  TAG: ${{ github.ref_name }}

jobs:
  draft:
    name: Draft release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Tag matches the app version
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match tauri.conf.json version $version (expected v$version)"
            exit 1
          fi

      - name: Create the draft (or reuse it on a re-run)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
              --title "tonality $TAG" --generate-notes

  build:
    name: ${{ matrix.name }}
    needs: draft
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Not older than 24.04: the prebuilt ONNX Runtime that `ort` links needs glibc 2.38
          # and GCC 13's libstdc++. The AppImage therefore needs glibc 2.39 or newer to run.
          - name: Linux AppImage
            os: ubuntu-24.04
            bundle: appimage
            artifact: target/release/bundle/appimage/*.AppImage
          - name: macOS (Apple Silicon)
            os: macos-latest
            bundle: dmg
            artifact: target/release/bundle/dmg/*.dmg
          - name: Windows installer
            os: windows-latest
            bundle: nsis
            artifact: target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - run: npm ci

      - name: Build
        shell: bash
        run: npm run tauri build -- --bundles ${{ matrix.bundle }}

      - name: Keep the installer for the release job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-${{ matrix.bundle }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installer-*
          path: installers
          merge-multiple: true

      - name: Attach the installers and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l installers
          gh release upload "$TAG" installers/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
