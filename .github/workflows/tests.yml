# Runs the tests on every pull request and on each merge into develop.
#
# Kept free: the repo is public, and standard GitHub-hosted Linux runners cost
# nothing for public repos. Don't switch to larger runners, macOS or Windows,
# or Git LFS, without checking the bill first. To use less, docs-only changes
# skip the tests, a newer push to the same PR cancels the older run, and only
# develop saves the Rust build cache (pull requests read it).

name: Tests

on:
  pull_request:
  push:
    branches: [develop]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      interface: ${{ steps.files.outputs.interface }}
      backend: ${{ steps.files.outputs.backend }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$PR" ]; then
            echo "interface=true" >> "$GITHUB_OUTPUT"
            echo "backend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename')
          echo "$files"
          # Docs never need the tests. Anything else outside src-tauri is the
          # interface; the workflow itself runs both.
          code=$(echo "$files" | grep -Ev '\.md$|^docs/|^LICENSE$|^\.github/(ISSUE_TEMPLATE/|pull_request_template\.md$)' || true)
          interface=false
          backend=false
          if echo "$code" | grep -Ev '^src-tauri/|^$' | grep -q .; then interface=true; fi
          if echo "$code" | grep -Eq '^src-tauri/|^\.github/workflows/'; then backend=true; fi
          echo "interface=$interface" >> "$GITHUB_OUTPUT"
          echo "backend=$backend" >> "$GITHUB_OUTPUT"

  # A skipped job counts as passed, so required checks don't wait on docs-only PRs.
  interface:
    name: Interface
    needs: changes
    if: needs.changes.outputs.interface == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun test
      # Type checks, then bundles.
      - run: bun run build

  backend:
    name: Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      # No debug info: a faster build and a smaller cache.
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The app embeds the built interface, so it has to exist to compile.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bunx vite build
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libheif-dev \
            mesa-vulkan-drivers
      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          save-if: ${{ github.ref == 'refs/heads/develop' }}
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings
      # The runner has no graphics card: mesa-vulkan-drivers gives the GPU
      # tests a software Vulkan device (lavapipe) to run on.
      - name: Tests
        working-directory: src-tauri
        run: cargo test --locked --no-fail-fast
