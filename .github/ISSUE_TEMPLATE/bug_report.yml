name: Bug report
description: Something doesn't work the way it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a library with …
        2. Select …
        3. …
  - type: input
    id: version
    attributes:
      label: tonality version
      description: Shown in Settings (Ctrl+,). Say whether it's Stable or Nightly.
      placeholder: 0.1.1 (Stable)
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system and GPU
      placeholder: Windows 11, RTX 4070
    validations:
      required: true
  - type: input
    id: camera
    attributes:
      label: Camera and file type
      description: For import, rendering or colour problems.
      placeholder: Sony A7 IV, ARW
  - type: textarea
    id: logs
    attributes:
      label: Screenshots or logs
      description: Drag in screenshots, or paste any error text.
