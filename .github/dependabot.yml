# Dependency updates. Security fixes come as soon as an advisory is published, whatever the
# schedule below; these are the routine version bumps, grouped so each ecosystem opens one PR.
#
# Cargo bumps change licences/THIRD-PARTY-NOTICES.txt, which CI checks. The Dependabot licences
# workflow regenerates it on each Cargo PR and pushes the result. After that push Dependabot
# won't rebase the PR itself: comment `@dependabot recreate` if it needs one.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # Tauri's npm packages have to stay on the same minor as its crates (CI checks, with
      # scripts/check-tauri.mjs), so they get a pull request of their own: bump the crates in
      # it, and the rest of the npm updates aren't held up meanwhile.
      tauri:
        patterns: ["@tauri-apps/*"]
      npm:
        update-types: [minor, patch]
        exclude-patterns: ["@tauri-apps/*"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    groups:
      # The other half of the npm group above.
      tauri:
        patterns: ["tauri", "tauri-*"]
      cargo:
        update-types: [minor, patch]
        exclude-patterns: ["tauri", "tauri-*"]
