# cargo-about's settings, for the third-party notices (`bun run notices`).
# The licences the app's crates may be used under, most preferred first:
# where a crate offers a choice, the notices carry the first one listed here.
# Each must be compatible with GPL-3.0-or-later.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "MPL-2.0",
    "LGPL-2.1",
    "LGPL-2.1-or-later",
    "CDLA-Permissive-2.0",
    "NCSA",
    # Tonality itself.
    "GPL-3.0-or-later",
]
# Every platform the app is built for, so the list covers all of them.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]
# Only what ends up in the app, not the tools that build or test it.
ignore-build-dependencies = true
ignore-dev-dependencies = true
