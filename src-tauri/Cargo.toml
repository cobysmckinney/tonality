[package]
name = "tonality"
version = "0.1.0"
description = "A raw photo editor"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tonality_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rawler = "0.8.0"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff", "webp"] }
kamadak-exif = "0.6.1"
blake3 = "1.8.7"
chrono = "0.4.45"
walkdir = "2.5.0"
rayon = "1.12.0"
anyhow = "1.0.104"
tauri-plugin-dialog = "2.8.1"
libheif-rs = { version = "3.0.0", optional = true, default-features = false, features = ["v1_17", "image"] }
fast_image_resize = "6.1.0"
wgpu = "30.0.1"
pollster = "1.0.1"
half = { version = "2.7.1", features = ["bytemuck"] }
bytemuck = { version = "1.25.2", features = ["derive"] }
# The subject model runs on the CPU in pure Rust, so mobile builds need no native runtime.
tract-onnx = "0.23.8"
tract-linalg = { version = "0.23.8", features = ["multithread-mm"] }
jpeg-decoder = { version = "0.3.2", default-features = false }


[features]
default = ["heif"]
# HEIC/HEIF decoding through the system libheif.
heif = ["dep:libheif-rs"]

# Image decoding and resizing are unusably slow unoptimized, and much of that
# code is generic and so compiled as part of this crate.
[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

[dev-dependencies]
tempfile = "3.27.0"
