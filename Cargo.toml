[workspace]
resolver = "2"
members = ["crates/*", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
ts-rs = "12"
blake3 = "1"
rusqlite = { version = "0.43", features = ["bundled"] }
rayon = "1"
half = { version = "2", features = ["bytemuck"] }
bytemuck = "1"
tonality-core = { path = "crates/tonality-core" }
tonality-raw = { path = "crates/tonality-raw" }
tonality-render = { path = "crates/tonality-render" }
tonality-ml = { path = "crates/tonality-ml" }

[profile.dev.package."*"]
opt-level = 3

# Pixel loops are unusably slow unoptimised, even in dev.
[profile.dev.package.tonality-raw]
opt-level = 3

[profile.dev.package.tonality-render]
opt-level = 3

[profile.dev.package.tonality-core]
opt-level = 3

[profile.dev.package.tonality-ml]
opt-level = 3
